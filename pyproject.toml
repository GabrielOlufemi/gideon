[project]
name = "gideon"
version = "0.1.0"
description = "Gabriels coding agent that lives in your terminal"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "rich",
    "prompt_toolkit",
    "questionary",
    "python-dotenv",
    "Pygments",
]

[project.scripts]
gideon = "gideon.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]